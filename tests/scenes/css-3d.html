<!-- 3D CSS: perspective, preserve-3d cube, backface-visibility card flips. -->
<style>
body { background: linear-gradient(160deg, #1b2a4a, #0b0f1a); }
.view { position: absolute; left: 192px; top: 120px; width: 400px; height: 400px; perspective: 900px; }
.cube { position: absolute; inset: 0; transform-style: preserve-3d; }
.face { position: absolute; inset: 0; border: 4px solid #fff; font: bold 120px sans-serif; color: #fff;
        display: flex; align-items: center; justify-content: center; opacity: .85; }
.cards { position: absolute; left: 0; top: 640px; width: 784px; display: flex; flex-wrap: wrap; gap: 24px;
         justify-content: center; perspective: 1200px; }
.card { position: relative; width: 160px; height: 220px; transform-style: preserve-3d; }
.card div { position: absolute; inset: 0; border-radius: 16px; backface-visibility: hidden;
            font: bold 64px sans-serif; display: flex; align-items: center; justify-content: center; }
.card .front { background: #ffbe0b; color: #000; }
.card .back { background: #8338ec; color: #fff; transform: rotateY(180deg); }
</style>
<div class="view"><div class="cube" id="cube"></div></div>
<div class="cards" id="cards"></div>
<script>
const cube = document.getElementById("cube");
const turns = ["rotateY(0deg)", "rotateY(90deg)", "rotateY(180deg)", "rotateY(-90deg)", "rotateX(90deg)", "rotateX(-90deg)"];
const colors = ["#ff006e", "#fb5607", "#ffbe0b", "#06d6a0", "#3a86ff", "#8338ec"];
turns.forEach((t, i) => {
  const f = cube.appendChild(document.createElement("div"));
  f.className = "face";
  f.textContent = i + 1;
  f.style.transform = `${t} translateZ(200px)`;
  f.style.background = colors[i];
});
const cards = Array.from({ length: 8 }, (_, i) => {
  const c = document.getElementById("cards").appendChild(document.createElement("div"));
  c.className = "card";
  c.innerHTML = `<div class="front">${i}</div><div class="back">${String.fromCharCode(65 + i)}</div>`;
  return c;
});
window.scene = (n) => {
  cube.style.transform = `rotateX(${n * 3}deg) rotateY(${n * 4}deg) rotateZ(${n}deg)`;
  cards.forEach((c, i) => { c.style.transform = `rotateY(${(n * 6 + i * 45) % 360}deg)`; });
};
</script>
