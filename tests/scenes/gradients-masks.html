<!-- Gradients, clip-path, masks, border-radius morphing. -->
<style>
#conic { position: absolute; left: 192px; top: 40px; width: 400px; height: 400px; border-radius: 50%; }
#clip { position: absolute; left: 142px; top: 480px; width: 500px; height: 320px;
        background: linear-gradient(90deg, #ff006e, #8338ec, #3a86ff); }
#mask { position: absolute; left: 0; top: 840px; width: 784px; height: 300px;
        background: repeating-linear-gradient(90deg, #06d6a0 0 20px, #118ab2 20px 40px); }
#morph { position: absolute; left: 20px; top: 20px; width: 140px; height: 140px; background: #ffbe0b; }
</style>
<div id="conic"></div><div id="clip"></div><div id="mask"></div><div id="morph"></div>
<script>
const $ = (id) => document.getElementById(id);
window.scene = (n) => {
  const t = n / 30;
  document.body.style.background =
    `radial-gradient(circle at ${50 + 40 * Math.cos(t)}% ${50 + 40 * Math.sin(t)}%, #334 0, #000 60%)`;
  $("conic").style.background = `conic-gradient(from ${n * 6}deg, #ff006e, #ffbe0b, #3a86ff, #8338ec, #ff006e)`;
  const inner = 20 + 30 * (1 + Math.sin(t * 2)) / 2;
  const star = Array.from({ length: 10 }, (_, i) => {
    const a = i * Math.PI / 5 + t, r = i % 2 ? inner : 50;
    return `${50 + r * Math.cos(a)}% ${50 + r * Math.sin(a)}%`;
  });
  $("clip").style.clipPath = `polygon(${star.join(",")})`;
  const m = `radial-gradient(circle at ${(n * 9) % 784}px 150px, #000 0 120px, transparent 121px)`;
  $("mask").style.maskImage = m;
  $("mask").style.webkitMaskImage = m;
  const a = 50 + 40 * Math.sin(t * 3);
  $("morph").style.borderRadius = `${a}% ${100 - a}% ${a}% ${100 - a}% / ${100 - a}% ${a}% ${100 - a}% ${a}%`;
};
</script>
