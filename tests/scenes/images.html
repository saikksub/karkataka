<!-- Images: SVG and canvas-made PNG data URIs, object-fit, background tiling, and a new image every frame awaited with decode(). -->
<style>
body { background: #222; }
#grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px; }
#grid img { width: 100%; height: 220px; object-fit: cover; border-radius: 16px; }
#swap { position: absolute; left: 242px; top: 540px; width: 300px; height: 300px; border-radius: 50%; }
#tiles { position: absolute; left: 0; bottom: 0; width: 784px; height: 300px; background-size: 160px 160px; }
</style>
<div id="grid"></div>
<img id="swap" alt="">
<div id="tiles"></div>
<script>
const svgUri = (hue, label) => "data:image/svg+xml," + encodeURIComponent(
  `<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300">
     <defs><linearGradient id="g" x2="1" y2="1"><stop offset="0" stop-color="hsl(${hue},80%,60%)"/>
       <stop offset="1" stop-color="hsl(${hue + 120},80%,40%)"/></linearGradient></defs>
     <rect width="400" height="300" fill="url(#g)"/><circle cx="200" cy="150" r="90" fill="rgba(255,255,255,.35)"/>
     <text x="200" y="175" font-size="72" text-anchor="middle" font-family="sans-serif" fill="#fff">${label}</text></svg>`);
const imgs = Array.from({ length: 6 }, (_, i) => {
  const img = document.getElementById("grid").appendChild(document.createElement("img"));
  img.src = svgUri(i * 60, i);
  return img;
});
const tile = document.createElement("canvas");
tile.width = tile.height = 160;
const tc = tile.getContext("2d");
tc.fillStyle = "#ffbe0b"; tc.fillRect(0, 0, 160, 160);
tc.fillStyle = "#8338ec"; tc.fillRect(0, 0, 80, 80); tc.fillRect(80, 80, 80, 80);
document.getElementById("tiles").style.backgroundImage = `url(${tile.toDataURL("image/png")})`;
const swap = document.getElementById("swap");
window.scene = async (n) => {
  await Promise.all(imgs.map((img) => img.decode()));
  imgs.forEach((img, i) => {
    img.style.objectPosition = `${50 + 50 * Math.sin(n / 15 + i)}% 50%`;
    img.style.transform = `scale(${1 + .1 * Math.sin(n / 10 + i)})`;
  });
  swap.src = svgUri(n * 5, n);
  await swap.decode();
  document.getElementById("tiles").style.backgroundPosition = `${n * 4}px ${n * 2}px`;
};
</script>
