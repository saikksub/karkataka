<!-- Canvas 2D: 3000 seeded particles with additive blending, shadows, paths and text, redrawn every frame. -->
<canvas id="c" width="784" height="1170"></canvas>
<script>
const ctx = document.getElementById("c").getContext("2d");
function rng(seed) {
  return () => {
    seed = (seed + 0x6d2b79f5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const r = rng(42);
const ps = Array.from({ length: 3000 }, () => ({
  x: r() * 784, y: r() * 1170, vx: (r() - .5) * 6, vy: (r() - .5) * 6, s: 1 + r() * 4, h: r() * 360,
}));
const wrap = (v, m) => ((v % m) + m) % m;
window.scene = (n) => {
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#05050a";
  ctx.fillRect(0, 0, 784, 1170);
  ctx.globalCompositeOperation = "lighter";
  for (const p of ps) {
    ctx.fillStyle = `hsla(${(p.h + n * 2) % 360},80%,60%,.6)`;
    ctx.beginPath();
    ctx.arc(wrap(p.x + p.vx * n, 784), wrap(p.y + p.vy * n, 1170), p.s, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = "source-over";
  ctx.save();
  ctx.translate(392, 585);
  ctx.rotate(n * 0.05);
  ctx.shadowColor = "#fff";
  ctx.shadowBlur = 30;
  ctx.strokeStyle = "#fff";
  ctx.lineWidth = 6;
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const a = i * Math.PI / 5, rr = i % 2 ? 80 : 200;
    ctx.lineTo(Math.cos(a) * rr, Math.sin(a) * rr);
  }
  ctx.closePath();
  ctx.stroke();
  ctx.restore();
  ctx.font = "bold 64px sans-serif";
  ctx.fillStyle = "#fff";
  ctx.textAlign = "center";
  ctx.fillText(`canvas ${n}`, 392, 1100);
};
</script>
