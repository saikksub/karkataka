<!-- Async frames: __setFrame waits on timers, microtasks, a Blob fetch, requestAnimationFrame and fonts before drawing. -->
<style>
body { background: #0b132b; }
#box { position: absolute; left: 192px; top: 300px; width: 400px; height: 400px; border-radius: 40px;
       background: #5bc0be; color: #0b132b; font: bold 64px sans-serif; display: flex; align-items: center; justify-content: center; }
</style>
<div id="box"></div>
<script>
const box = document.getElementById("box");
window.scene = async (n) => {
  await new Promise((r) => setTimeout(r, n % 4));
  await Promise.resolve();
  const url = URL.createObjectURL(new Blob([JSON.stringify({ n })], { type: "application/json" }));
  const data = await (await fetch(url)).json();
  URL.revokeObjectURL(url);
  if (n % 10 === 0) await new Promise((r) => requestAnimationFrame(() => r()));
  await document.fonts.ready;
  box.textContent = `async ${data.n}`;
  box.style.transform = `rotate(${n * 4}deg) scale(${1 + .2 * Math.sin(n / 10)})`;
  box.style.background = `hsl(${n * 3}, 60%, 55%)`;
};
</script>
