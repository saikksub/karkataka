<!-- WebGL: a full-stage fragment shader driven by a time uniform. Fails (red cells) if WebGL is unavailable. -->
<canvas id="c" width="784" height="1170"></canvas>
<script>
const gl = document.getElementById("c").getContext("webgl");
if (!gl) {
  fail("no WebGL context");
} else {
  const compile = (type, src) => {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) fail(gl.getShaderInfoLog(s));
    return s;
  };
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, "attribute vec2 p; void main() { gl_Position = vec4(p, 0.0, 1.0); }"));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, `
    precision mediump float;
    uniform float t;
    uniform vec2 size;
    void main() {
      vec2 uv = (gl_FragCoord.xy - 0.5 * size) / size.y;
      float v = sin(uv.x * 10.0 + t) + sin(uv.y * 12.0 - t * 1.3) + sin(length(uv) * 20.0 - t * 2.0);
      float ring = smoothstep(0.02, 0.0, abs(length(uv) - 0.3 - 0.1 * sin(t)));
      gl_FragColor = vec4(0.5 + 0.5 * sin(v + vec3(0.0, 2.0, 4.0)) + ring, 1.0);
    }`));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail(gl.getProgramInfoLog(prog));
  gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const p = gl.getAttribLocation(prog, "p");
  gl.enableVertexAttribArray(p);
  gl.vertexAttribPointer(p, 2, gl.FLOAT, false, 0, 0);
  gl.uniform2f(gl.getUniformLocation(prog, "size"), 784, 1170);
  const t = gl.getUniformLocation(prog, "t");
  window.scene = (n) => {
    gl.viewport(0, 0, 784, 1170);
    gl.uniform1f(t, n / 30);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  };
}
</script>
