[package]
name = "karka"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "karka: render video scenes written as web pages, on the GPU, from the command line."
readme = "../../README.md"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
karkataka-encode = { version = "0.0.0", path = "../encode" }
karkataka-engine = { version = "0.0.0", path = "../engine" }
png = "0.18.1"
serde_json = "1.0.154"

[target.'cfg(target_os = "macos")'.dependencies]
cef = "=156.4.0"
semver = "1.0.28"

# macOS: `cargo run -p karka --bin bundle-karka` builds karka.app with these helper processes.
[package.metadata.cef.bundle]
helper_name = "karka_helper"
